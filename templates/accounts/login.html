{% extends 'base.html' %}

{% block title %}Login{% endblock title %}

{% block content %}

<section class="account-page">
    <div class="account-card">
        <h1>Welcome Back</h1>
        <p>Log in to continue your BartoArts journey.</p>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="account-btn">Log In</button>
        </form>

        <p class="account-link">
            Need an account?
            <a href="{% url 'signup' %}">Sign up here</a>
        </p>
    </div>
</section>

{% endblock content %}
