{% extends 'base.html' %}

{% block title %}Sign Up{% endblock title %}

{% block content %}

<section class="account-page">
    <div class="account-card">
        <h1>Create Account</h1>
        <p>Join BartoArts to save favorites, explore updates, and connect with the studio.</p>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="account-btn">Sign Up</button>
        </form>

        <p class="account-link">
            Already have an account?
            <a href="{% url 'login' %}">Log in here</a>
        </p>
    </div>
</section>

{% endblock content %}
