<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Art Blog{% endblock %}</title>


    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/base.css' %}?v=5">
    {% block css %}{% endblock %}
</head>
<body>
    
    <nav>
        <a href="{% url 'gallery' %}">画廊</a>
        <a href="{% url 'shop' %}">Shop</a>
        <a href="{% url 'blog' %}">Blog</a>
        <a href="{% url 'about' %}">About</a>
        <a href="{% url 'contact' %}">Contact</a>
        <a href="{% url 'commissions' %}">Commissions</a>
    </nav>

    <div class="main {% block main_class %}{% endblock %}">
        {% block content %}{% endblock %}
    </div>

    <footer class="site-footer">
        <div class="footer-logo-area">
            <img src="{% static 'img/images/sig2.png' %}" alt="BartoArts Logo" class="footer-logo-img">

            <h2>BartoArts</h2>
            <p>Art, stories, and imagination.</p>

            <a href="{% url 'contact' %}" class="footer-btn">Contact Us</a>

            <div class="stars">
                <h1>★★★</h1>
            </div>
        </div>

        <div class="footer-signature">
            <p>BartoArts ★ Created by Steph Truitt</p>
        </div>
    </footer>



    {% block js %}{% endblock %}
</body>
</html>
